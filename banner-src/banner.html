<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A; --ink-deep:#060606;
    --scarlet:#8B1A1A; --scarlet-bright:#A82323; --scarlet-deep:#5E1212;
    --ivory:#F5F0EB; --ivory-dim:#CFC8BF; --muted:#A39D94; --muted-2:#928C83;
    --gold:#C9A84C; --gold-soft:#D9BE6E; --hairline:#1F1F1F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:500px;overflow:hidden}
  body{background:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

  .banner{position:relative;width:1600px;height:500px;overflow:hidden;background:var(--ink-deep)}

  /* dawn light: gold high-left, scarlet low-right, over near-black */
  .glow{position:absolute;inset:0}
  .glow::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(900px 520px at 78% 112%, rgba(139,26,26,.62), transparent 62%),
      radial-gradient(760px 460px at 12% -18%, rgba(201,168,76,.13), transparent 66%),
      radial-gradient(1200px 700px at 50% 50%, #101010, #060606 78%);}

  .topo{position:absolute;inset:0;opacity:.66;mix-blend-mode:screen}
  .topo svg{width:1600px;height:500px;display:block}

  /* warm grain */
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

  .vignette{position:absolute;inset:0;
    background:radial-gradient(1400px 620px at 42% 46%, transparent 40%, rgba(0,0,0,.55) 100%)}

  /* left scarlet spine + bottom gold hairline */
  .spine{position:absolute;left:0;top:0;bottom:0;width:6px;
    background:linear-gradient(180deg,var(--scarlet-deep),var(--scarlet-bright) 45%,var(--scarlet-deep))}
  .base{position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,var(--scarlet) 0%,rgba(201,168,76,.55) 42%,transparent 78%)}

  .copy{position:absolute;left:84px;top:0;bottom:0;width:1000px;
    display:flex;flex-direction:column;justify-content:center;z-index:3}

  .eyebrow{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:14px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
  .eyebrow .dim{color:var(--muted-2)}

  h1{font-family:Montserrat,sans-serif;font-weight:900;font-size:94px;line-height:.94;
    letter-spacing:-.035em;color:var(--ivory);text-shadow:0 2px 40px rgba(0,0,0,.6)}

  .rule{width:78px;height:4px;background:var(--scarlet-bright);margin:26px 0 22px;border-radius:2px}

  .lead{font-family:Inter,sans-serif;font-weight:500;font-size:25px;line-height:1.42;
    color:var(--ivory-dim);max-width:640px}
  .lead b{color:var(--ivory);font-weight:600}

  .creds{position:absolute;left:84px;bottom:44px;z-index:3;
    font-family:"JetBrains Mono",monospace;font-weight:400;font-size:13.5px;
    letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:14px;white-space:nowrap}
  .creds .dot{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.8;flex:none}

  /* portrait */
  .figure{position:absolute;right:72px;bottom:-6px;height:436px;z-index:2}
  .figure img{height:436px;width:auto;display:block;
    filter:drop-shadow(0 22px 46px rgba(0,0,0,.65)) contrast(1.04) saturate(1.05)}
  .figure::before{content:"";position:absolute;left:-14%;top:8%;width:128%;height:104%;
    background:radial-gradient(closest-side, rgba(168,35,35,.42), transparent 72%);z-index:-1;filter:blur(6px)}
  /* ground the cutout so it does not float */
  .figure::after{content:"";position:absolute;left:2%;bottom:-6px;width:96%;height:26px;
    background:radial-gradient(closest-side, rgba(0,0,0,.72), transparent 76%)}
</style>
<script>document.documentElement.dataset.layer=location.hash.slice(1)||"full"</script>
<style>
  html:not([data-layer="full"]) body,
  html:not([data-layer="full"]) .banner{background:transparent}
  html:not([data-layer="full"]) .glow,
  html:not([data-layer="full"]) .topo,
  html:not([data-layer="full"]) .vignette,
  html:not([data-layer="full"]) .grain,
  html:not([data-layer="full"]) .spine,
  html:not([data-layer="full"]) .base,
  html:not([data-layer="full"]) .copy,
  html:not([data-layer="full"]) .creds,
  html:not([data-layer="full"]) .figure{display:none}
  html[data-layer="bg"] .glow,
  html[data-layer="bg"] .grain,
  html[data-layer="bg"] .spine,
  html[data-layer="bg"] .base,
  html[data-layer="photo"] .figure,
  html[data-layer="text"] .copy,
  html[data-layer="creds"] .creds{display:block}
  /* The cutout's red glow and ground shadow are soft gradients. They belong on
     the opaque bg layer, where JPEG costs nothing, instead of inflating the
     alpha PNG that carries the cutout itself. */
  html[data-layer="bg"] .figure{display:block}
  html[data-layer="bg"] .figure img{visibility:hidden}
  html[data-layer="photo"] .figure::before,
  html[data-layer="photo"] .figure::after{display:none}
  html[data-layer="creds"] .creds{display:flex}
</style>
